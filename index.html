<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1916" media="(prefers-color-scheme: dark)">
  <!-- 修改这里可以更改浏览器标签页上的标题。 -->
  <title>The Luxe Defender Corporation</title>
  <!-- 提前读取本地字体；无需联网。 -->
  <link rel="preload" href="./fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- 首屏背景直接适配主题，样式加载期间也保持相同底色。 -->
  <style>
    html { color-scheme: light dark; background: #f7f3ec; }
    @media (prefers-color-scheme: dark) { html { background: #1e1916; } }
    html.startup-pending .page > * { opacity: 0 !important; }
    html.startup-fallback {
      --font-cormorant: Georgia, serif;
      --font-dm-sans: Arial, sans-serif;
      --font-grotesk: Arial, sans-serif;
      --font-mono: monospace;
    }
  </style>
  <!-- 字体和本地图标准备好后一起显示，避免默认字体切换及图标迟到。 -->
  <script>
    (() => {
      if (!document.fonts) return;
      const root = document.documentElement;
      root.classList.add("startup-pending");
      const reveal = () => root.classList.remove("startup-pending");
      // 文件缺失或加载异常时仍能显示内容，不会一直隐藏页面。
      const limit = setTimeout(() => {
        // 超时后保持回退字体，避免迟到的字体再次改变已显示的排版。
        root.classList.add("startup-fallback");
        reveal();
      }, 3000);
      window.addEventListener("DOMContentLoaded", () => {
        const fonts = Array.from(document.fonts, font => font.load());
        const images = Array.from(document.images, image =>
          typeof image.decode === "function" ? image.decode() : Promise.resolve()
        );
        Promise.allSettled([...fonts, ...images])
          .then(() => document.fonts.ready)
          .then(() => { clearTimeout(limit); reveal(); }, reveal);
      }, { once: true });
    })();
  </script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M18 48V29a14 14 0 0 1 28 0v19M12 49h40M25 48V30a7 7 0 0 1 14 0v18' fill='none' stroke='%23917750' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <main class="page">
    <!-- 装饰性门廊标志，不包含需要修改的文字。 -->
    <div class="masthead" aria-hidden="true">
      <span class="masthead-line"></span>
      <svg class="emblem" viewBox="0 0 64 64" fill="none">
        <path d="M18 48V29a14 14 0 0 1 28 0v19M12 49h40" stroke="currentColor" stroke-width="1.3"/>
        <path d="M25 48V30a7 7 0 0 1 14 0v18" stroke="currentColor" stroke-width="1.1"/>
        <path d="M32 4l3 4-3 4-3-4 3-4Z" fill="currentColor"/>
        <path d="M9 41c-3-5-3-11 0-16M55 41c3-5 3-11 0-16" stroke="currentColor" stroke-width="1" opacity=".5"/>
        <path d="M22 55h20" stroke="currentColor" stroke-width="1" opacity=".5"/>
      </svg>
      <span class="masthead-line"></span>
    </div>

    <div class="hero">
      <!-- 公司名称：直接修改下面的文字。Corporation 也是主标题的一部分。 -->
      <h1>
        <span class="title-line">The Luxe Defender</span>
        <span class="title-line corporation">Corporation</span>
      </h1>
      <div class="ornament" aria-hidden="true"><span></span></div>
    </div>

    <!-- 两个分支名称：修改文字时保留 HTML 标签即可。 -->
    <div class="branches">
      <section class="branch">
        <h2>
          <span class="section-name">Section I</span>
          <span class="branch-title">Hospitality and Fitness</span>
        </h2>
      </section>
      <section class="branch">
        <h2>
          <span class="section-name">Section II</span>
          <span class="branch-title">Recreation, Social Life and Relationships</span>
        </h2>
      </section>
    </div>

    <div class="closing-mark" aria-hidden="true"></div>
  </main>
</body>
</html>
